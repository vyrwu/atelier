# acme-platform — DevOps org demo/test scenario for the atelier sandbox.
#
# Models the v1 intent-workspace world: a WORKSPACE is an INTENT (a task
# handed to the agent), not a repo. Each workspace owns a dedicated root
# into which one or more repo worktrees are symlinked (<root>/<repo>/<branch>),
# a driver agent window, and a set of PRs. Repos are built independently and
# real; a workspace's worktrees reference branches those repos declare.
#
# ~10 real git repos, several with multiple worktrees. A mix of states:
#   - attention (⏺): the driver agent finished blocked on you
#   - forge PR badge (open/draft/merged/closed) + CI + review decision, via
#     the mock github integration (offline, from the seeded fixture)
#   - multi-repo intents (one workspace spanning several repos) and
#     single-repo intents
#
# Everything becomes REAL: git repos with real commits + a local bare
# origin (so `git fetch` freshness works), real worktrees, real uncommitted
# edits, real ahead/behind divergence, and real symlinked workspace roots.
# Only the recap/attention/PR values are pre-seeded atelier state — no live
# agent runs. The sandbox configures ai = "mock" so M-n works offline.
#
# Copy + edit + launch:  go run ./sandbox --scenario /path/to/your.yaml

name: acme-platform
description: "DevOps org: helm, terraform, argocd, k8s, docker, ansible, observability, catalog, CI"

# Land on a workspace WITHOUT attention so attention badges are revealed
# via M-s rather than landed on.
lastActive: service-catalog-ownership

repos:
  # === helm-charts — 2 worktrees ===========================================
  - slug: acme-platform/helm-charts
    files:
      README.md: "# helm-charts\n\nUmbrella Helm charts for the acme platform.\n"
      charts/redis/values.yaml: "replicaCount: 3\nimage:\n  tag: \"7.2.4\"\n"
      charts/ingress-nginx/Chart.yaml: "name: ingress-nginx\nversion: 0.3.0\ndependencies:\n  - name: ingress-nginx\n    version: \"4.11.2\"\n"
    worktrees:
      - branch: feat/bump-ingress-nginx
        commits:
          - message: "feat: bump ingress-nginx 4.11.2 -> 4.12.1"
            files:
              charts/ingress-nginx/Chart.yaml: "name: ingress-nginx\nversion: 0.3.0\ndependencies:\n  - name: ingress-nginx\n    version: \"4.12.1\"\n"
        dirty:
          charts/redis/values.yaml: "replicaCount: 5\nimage:\n  tag: \"7.2.4\"\n"
      - branch: feat/redis-pdb

  # === terraform-infra — default branch + 1 worktree, diverged ============
  - slug: acme-platform/terraform-infra
    files:
      README.md: "# terraform-infra\n\nVPC, EKS, IRSA. State in S3.\n"
      eks.tf: "module \"eks\" {\n  cluster_version = \"1.29\"\n  desired_size    = 3\n}\n"
    originCommits:
      - message: "docs: on-call runbook note"
        files:
          README.md: "# terraform-infra\n\nVPC, EKS, IRSA. State in S3.\n\n> runbook: docs/runbook.md\n"
    localCommits:
      - message: "feat: scale node group to 4"
        files:
          eks.tf: "module \"eks\" {\n  cluster_version = \"1.29\"\n  desired_size    = 4\n}\n"
      - message: "feat: raise node group max to 9"
        files:
          eks.tf: "module \"eks\" {\n  cluster_version = \"1.29\"\n  desired_size    = 4\n  max_size        = 9\n}\n"
    worktrees:
      - branch: feat/eks-1-30-upgrade
        dirty:
          eks.tf: "module \"eks\" {\n  cluster_version = \"1.30\"\n  desired_size    = 4\n  max_size        = 9\n}\n"

  # === gitops-argocd — 2 worktrees =========================================
  - slug: acme-platform/gitops-argocd
    files:
      README.md: "# gitops-argocd\n\nArgo CD app-of-apps.\n"
      apps/root.yaml: "kind: Application\nmetadata:\n  name: root\n  annotations:\n    argocd.argoproj.io/sync-wave: \"0\"\n"
    worktrees:
      - branch: chore/sync-wave-annotations
      - branch: fix/drift-detection
        dirty:
          apps/root.yaml: "kind: Application\nmetadata:\n  name: root\n  annotations:\n    argocd.argoproj.io/sync-wave: \"0\"\n    argocd.argoproj.io/compare-options: IgnoreExtraneous\n"

  # === platform-scripts — soft-closed worktree for M-r =====================
  - slug: acme-platform/platform-scripts
    files:
      README.md: "# platform-scripts\n\nBash + CI glue.\n"
      ci/cache-key.sh: "#!/usr/bin/env bash\nhash=\"$(cat go.sum 2>/dev/null | shasum | cut -d' ' -f1)\"\necho \"acme-ci-${hash:-none}\"\n"
    worktrees:
      - branch: fix/ci-cache-key
        commits:
          - message: "fix: sha256 cache key to avoid collisions"
            files:
              ci/cache-key.sh: "#!/usr/bin/env bash\nhash=\"$(cat go.sum 2>/dev/null | shasum -a 256 | cut -d' ' -f1)\"\necho \"acme-ci-${hash:-none}\"\n"
        softClosed: true

  # === k8s-manifests =======================================================
  - slug: acme-platform/k8s-manifests
    files:
      README.md: "# k8s-manifests\n\nKustomize bases + overlays.\n"
      base/deployment.yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\n"
    worktrees:
      - branch: feat/kustomize-overlays
        dirty:
          overlays/staging/kustomization.yaml: "resources:\n  - ../../base\nreplicas:\n  - name: api\n    count: 2\n"

  # === docker-images — diverged (base image CVE) ===========================
  - slug: acme-platform/docker-images
    files:
      README.md: "# docker-images\n\nBase + service images.\n"
      base/Dockerfile: "FROM debian:12.5-slim\nRUN apt-get update && apt-get install -y ca-certificates\n"
    originCommits:
      - message: "chore: security team pinned base to 12.6"
        files:
          base/Dockerfile: "FROM debian:12.6-slim\nRUN apt-get update && apt-get install -y ca-certificates\n"
    worktrees:
      - branch: chore/base-image-cve
        dirty:
          base/Dockerfile: "FROM debian:12.6-slim\nRUN apt-get update && apt-get install -y ca-certificates tzdata\n"

  # === ansible-playbooks ===================================================
  - slug: acme-platform/ansible-playbooks
    files:
      README.md: "# ansible-playbooks\n\nNode provisioning + hardening.\n"
      site.yml: "- hosts: all\n  roles:\n    - common\n"
    worktrees:
      - branch: feat/node-hardening

  # === observability-stack — 2 worktrees ===================================
  - slug: acme-platform/observability-stack
    files:
      README.md: "# observability-stack\n\nPrometheus + Grafana + Alertmanager.\n"
      prometheus/rules.yaml: "groups:\n  - name: slo\n    rules: []\n"
    worktrees:
      - branch: feat/slo-alerts
        dirty:
          prometheus/rules.yaml: "groups:\n  - name: slo\n    rules:\n      - alert: ApiErrorBudgetBurn\n        expr: job:slo_errors:ratio > 0.02\n"
      - branch: chore/grafana-dashboards

  # === service-catalog =====================================================
  - slug: acme-platform/service-catalog
    files:
      README.md: "# service-catalog\n\nBackstage catalog entries.\n"
      catalog-info.yaml: "apiVersion: backstage.io/v1alpha1\nkind: Component\nmetadata:\n  name: api\n"
    worktrees:
      - branch: chore/backfill-ownership
        dirty:
          catalog-info.yaml: "apiVersion: backstage.io/v1alpha1\nkind: Component\nmetadata:\n  name: api\nspec:\n  owner: platform-team\n"

  # === ci-pipelines ========================================================
  - slug: acme-platform/ci-pipelines
    files:
      README.md: "# ci-pipelines\n\nReusable GitHub Actions workflows.\n"
      .github/workflows/e2e.yml: "name: e2e\non: [pull_request]\njobs:\n  e2e:\n    runs-on: ubuntu-latest\n"
    worktrees:
      - branch: fix/flaky-e2e
        dirty:
          .github/workflows/e2e.yml: "name: e2e\non: [pull_request]\njobs:\n  e2e:\n    runs-on: ubuntu-latest\n    steps:\n      - run: go test -count=1 -race ./...\n"

# Workspaces are INTENTS. Each spans one or more repo worktrees (symlinked
# into its root), carries a driver-agent recap, and lists its PRs. A couple
# are multi-repo; the rest single-repo. `attention: true` = ⏺ badge.
workspaces:
  # --- multi-repo: an EKS minor upgrade touching infra + argocd + images ---
  - slug: eks-1-30-upgrade
    title: "EKS 1.30 upgrade"
    intent: "Upgrade the cluster to Kubernetes 1.30: bump the node group, reconcile the argocd drift it surfaces, and rebuild base images against the patched debian."
    summary: "3 PRs open · argocd drift still needs your eyes"
    tag: infra
    createdAt: 40m
    attention: true
    recap: "eks 1.29->1.30 plan clean; argocd still shows 3 drifting objects in prod after IgnoreExtraneous"
    recapAge: 11m
    worktrees:
      - {repoSlug: acme-platform/terraform-infra, branch: feat/eks-1-30-upgrade}
      - {repoSlug: acme-platform/gitops-argocd, branch: fix/drift-detection}
      - {repoSlug: acme-platform/docker-images, branch: chore/base-image-cve}
    prs:
      - {number: 412, repoSlug: acme-platform/terraform-infra, branch: feat/eks-1-30-upgrade, title: "Upgrade EKS control plane to 1.30", state: open, ci: pass, reviewDecision: review_required, comments: 2, url: "https://example.test/acme-platform/terraform-infra/pull/412"}
      - {number: 208, repoSlug: acme-platform/gitops-argocd, branch: fix/drift-detection, title: "Ignore extraneous fields to quiet drift", state: open, ci: fail, reviewDecision: changes_requested, comments: 5, url: "https://example.test/acme-platform/gitops-argocd/pull/208"}
      - {number: 77, repoSlug: acme-platform/docker-images, branch: chore/base-image-cve, title: "Patch base image to debian 12.6 + tzdata", state: open, ci: pending, url: "https://example.test/acme-platform/docker-images/pull/77"}

  # --- multi-repo: platform hardening across helm + observability + ansible -
  - slug: platform-hardening
    title: "Platform hardening rollout"
    intent: "Harden the platform: ship the ingress-nginx bump + redis PDB in helm, wire SLO burn alerts and RED dashboards in observability, and add the CIS node-hardening role."
    summary: "1 merged · 1 draft · redis PDB still WIP"
    tag: platform
    createdAt: 1h30m
    recap: "ingress bump + dashboards landed; still drafting the redis PDB maxUnavailable and tuning the SLO burn threshold"
    recapAge: 26m
    worktrees:
      - {repoSlug: acme-platform/helm-charts, branch: feat/bump-ingress-nginx}
      - {repoSlug: acme-platform/helm-charts, branch: feat/redis-pdb}
      - {repoSlug: acme-platform/observability-stack, branch: feat/slo-alerts}
      - {repoSlug: acme-platform/observability-stack, branch: chore/grafana-dashboards}
      - {repoSlug: acme-platform/ansible-playbooks, branch: feat/node-hardening}
    prs:
      - {number: 331, repoSlug: acme-platform/helm-charts, branch: feat/bump-ingress-nginx, title: "Bump ingress-nginx 4.11 -> 4.12", state: open, ci: pass, reviewDecision: approved, comments: 1, url: "https://example.test/acme-platform/helm-charts/pull/331"}
      - {number: 332, repoSlug: acme-platform/helm-charts, branch: feat/redis-pdb, title: "Add redis PodDisruptionBudget", state: draft, ci: pending, url: "https://example.test/acme-platform/helm-charts/pull/332"}
      - {number: 145, repoSlug: acme-platform/observability-stack, branch: feat/slo-alerts, title: "Error-budget burn alert", state: draft, ci: fail, comments: 3, url: "https://example.test/acme-platform/observability-stack/pull/145"}
      - {number: 146, repoSlug: acme-platform/observability-stack, branch: chore/grafana-dashboards, title: "RED dashboards as code", state: merged, ci: pass, reviewDecision: approved, comments: 4, url: "https://example.test/acme-platform/observability-stack/pull/146"}

  # --- single-repo: argocd sync-wave cleanup (merged) ----------------------
  - slug: argocd-sync-waves
    title: "ArgoCD sync-wave ordering"
    intent: "Normalize argocd sync-wave annotations so CRDs apply before the workloads that depend on them."
    summary: "PR merged, nothing pending"
    tag: platform
    createdAt: 2h
    recap: "normalized sync-waves so CRDs apply first; lint clean, PR merged"
    recapAge: 1h40m
    worktrees:
      - {repoSlug: acme-platform/gitops-argocd, branch: chore/sync-wave-annotations}
    prs:
      - {number: 205, repoSlug: acme-platform/gitops-argocd, branch: chore/sync-wave-annotations, title: "Order sync-waves so CRDs apply first", state: merged, ci: pass, reviewDecision: approved, comments: 2, url: "https://example.test/acme-platform/gitops-argocd/pull/205"}

  # --- single-repo: kustomize overlays (closed without merge) --------------
  - slug: kustomize-overlays
    title: "Kustomize staging/prod split"
    intent: "Split the kustomize base into staging and prod overlays with per-env replica counts."
    summary: "Closed — superseded by the helm rollout"
    tag: platform
    createdAt: 25m
    recap: "split staging/prod overlays (staging replicas=2); closed in favor of the helm approach"
    recapAge: 18m
    worktrees:
      - {repoSlug: acme-platform/k8s-manifests, branch: feat/kustomize-overlays}
    prs:
      - {number: 90, repoSlug: acme-platform/k8s-manifests, branch: feat/kustomize-overlays, title: "Staging/prod kustomize overlays", state: closed, ci: pass, url: "https://example.test/acme-platform/k8s-manifests/pull/90"}

  # --- single-repo: flaky e2e (attention, open, CI failing) ----------------
  - slug: fix-flaky-e2e
    title: "Fix flaky e2e pipeline"
    intent: "Track down and fix the intermittently failing e2e workflow — add -race and force a single run to surface the data race."
    summary: "CI still red, reproducing locally"
    tag: ci
    createdAt: 4m
    attention: true
    recap: "added -race -count=1; reproduced the flaky e2e locally, isolating the shared-state race"
    recapAge: 3m
    worktrees:
      - {repoSlug: acme-platform/ci-pipelines, branch: fix/flaky-e2e}
    prs:
      - {number: 19, repoSlug: acme-platform/ci-pipelines, branch: fix/flaky-e2e, title: "Race-detect the e2e job", state: open, ci: fail, reviewDecision: changes_requested, comments: 6, url: "https://example.test/acme-platform/ci-pipelines/pull/19"}

  # --- single-repo: service-catalog ownership backfill (no PR yet) ---------
  - slug: service-catalog-ownership
    title: "Backfill service ownership"
    intent: "Backfill missing owner fields on the backstage catalog entries so every component has an on-call team."
    summary: "6 components, 2 left — no PR yet"
    tag: catalog
    createdAt: 12m
    recap: "backfilling ownership on 6 components; 2 left before opening the PR"
    recapAge: 7m
    worktrees:
      - {repoSlug: acme-platform/service-catalog, branch: chore/backfill-ownership}
