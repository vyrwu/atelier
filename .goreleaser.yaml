version: 2

project_name: atelier

# One binary: the UI, the CLI, and the MCP server (NFR-S2).
builds:
  - id: atelier
    main: ./cmd/atelier
    binary: atelier
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath, -mod=readonly]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: atelier
    ids: [atelier]
    name_template: >-
      atelier_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

# Homebrew cask (top-level `brews`/formula is deprecated in goreleaser v2). A
# cask quarantines the downloaded binary, so Gatekeeper blocks the un-notarized
# binary ("atelier cannot be verified"). The post-install hook strips the
# quarantine xattr so it runs without a prompt. One pre-built binary; deps below.
homebrew_casks:
  - name: atelier
    ids: [atelier]
    binaries:
      - atelier
    repository:
      owner: vyrwu
      name: homebrew-tap
    # The release workflow publishes this in a separate job with a tap-only
    # App token, after every archive has signed build provenance.
    skip_upload: true
    directory: Casks
    homepage: https://github.com/vyrwu/atelier
    description: A workshop for parallel coding agents — one binary, tmux + Bubble Tea
    dependencies:
      - formula: tmux
      - formula: git
      - formula: gh
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/atelier"]
          end

# Native Linux packages. The executable is the same statically linked binary
# shipped in the archives; users install runtime tools separately.
nfpms:
  - id: atelier
    ids: [atelier]
    package_name: atelier
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Atelier
    homepage: https://github.com/vyrwu/atelier
    maintainer: Atelier releases <releases@users.noreply.github.com>
    description: A workshop for parallel coding agents — tmux and Bubble Tea
    license: MIT
    section: utils
    formats: [deb, rpm, apk]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/atelier/LICENSE
        file_info:
          mode: 0644
    rpm:
      signature:
        key_file: &gpg_key_file '{{ if .IsSnapshot }}{{ envOrDefault "ATELIER_SIGNING_GPG_KEY_FILE" "" }}{{ else }}{{ .Env.ATELIER_SIGNING_GPG_KEY_FILE }}{{ end }}'
    deb:
      signature:
        key_file: *gpg_key_file
        type: origin
    apk:
      signature:
        key_file: '{{ if .IsSnapshot }}{{ envOrDefault "ATELIER_SIGNING_APK_KEY_FILE" "" }}{{ else }}{{ .Env.ATELIER_SIGNING_APK_KEY_FILE }}{{ end }}'
        key_name: atelier

checksum:
  name_template: 'atelier_{{ .Version }}_checksums.txt'
  # A glob allows unsigned snapshots before key provisioning. Production
  # with-keys.sh requires both exact public keys before building anything.
  extra_files:
    - glob: packaging/keys/atelier.{asc,rsa.pub}

# Passphrases go through stdin; never place them on the command line.
signs:
  - artifacts: checksum
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --passphrase-fd
      - "0"
      - --local-user
      - "{{ .Env.ATELIER_SIGNING_GPG_FINGERPRINT }}"
      - --output
      - ${signature}
      - --detach-sign
      - ${artifact}
    stdin: "{{ .Env.NFPM_ATELIER_PASSPHRASE }}"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?:'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?:'
      order: 1
    - title: Refactors
      regexp: '^.*?refactor(\(.+\))?:'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - typo

release:
  # Retries of the same validated commit must recover after partial uploads or
  # failed attestation. release-guard.sh rejects moved, deleted and stale tags.
  replace_existing_artifacts: true
  extra_files:
    - glob: packaging/keys/atelier.{asc,rsa.pub}
  github:
    owner: vyrwu
    name: atelier
  prerelease: auto
  header: |
    ## atelier {{ .Tag }}

    A workshop for parallel coding agents. One binary, one renderer
    (Bubble Tea), tmux-driven. See the [README](https://github.com/vyrwu/atelier#quick-start).
  footer: |
    ---

    **Install the binary:**

    1. Download the archive for your OS + arch and extract it:
       `tar -xzf atelier_*.tar.gz`
    2. Move it onto your PATH: `mv atelier ~/.local/bin/`
    3. Wire up hooks + bindings: `atelier install`
    4. Launch (from a plain terminal): `atelier`

    Requires `tmux`, `git`, and `gh`. Checksums: `atelier_{{ .Version }}_checksums.txt`.

    Verify the downloaded archive or Linux package before installing it:
    `gh attestation verify <file> --repo vyrwu/atelier --signer-workflow vyrwu/atelier/.github/workflows/release.yml --source-ref refs/tags/{{ .Tag }} --deny-self-hosted-runners`

    Linux packages and the checksum manifest are also signed with Atelier release
    keys. See the [verification and installation guide](https://github.com/vyrwu/atelier/blob/{{ .Tag }}/docs/release-security.md#verify-and-install-downloads).
