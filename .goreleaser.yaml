version: 2

project_name: atelier

before:
  hooks:
    - go mod tidy

# One binary: the UI, the CLI, and the MCP server (NFR-S2).
builds:
  - id: atelier
    main: ./cmd/atelier
    binary: atelier
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: atelier
    ids: [atelier]
    name_template: >-
      atelier_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

# Homebrew cask (top-level `brews`/formula is deprecated in goreleaser v2). A
# cask quarantines the downloaded binary, so Gatekeeper blocks the un-notarized
# binary ("atelier cannot be verified"). The post-install hook strips the
# quarantine xattr so it runs without a prompt. One pre-built binary; deps below.
homebrew_casks:
  - name: atelier
    ids: [atelier]
    binaries:
      - atelier
    repository:
      owner: vyrwu
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: https://github.com/vyrwu/atelier
    description: A switchboard for parallel Claude Code sessions — one binary, tmux + Bubble Tea
    dependencies:
      - formula: tmux
      - formula: git
      - formula: gh
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atelier"]
          end

checksum:
  name_template: 'atelier_{{ .Version }}_checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?:'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?:'
      order: 1
    - title: Refactors
      regexp: '^.*?refactor(\(.+\))?:'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - typo

release:
  github:
    owner: vyrwu
    name: atelier
  prerelease: auto
  header: |
    ## atelier {{ .Tag }}

    A switchboard for parallel Claude Code sessions. One binary, one renderer
    (Bubble Tea), tmux-driven. See the [README](https://github.com/vyrwu/atelier#build--run).
  footer: |
    ---

    **Install the binary:**

    1. Download the archive for your OS + arch and extract it:
       `tar -xzf atelier_*.tar.gz`
    2. Move it onto your PATH: `mv atelier ~/.local/bin/`
    3. Wire up hooks + bindings: `atelier install`
    4. Launch (from a plain terminal): `atelier`

    Requires `tmux`, `git`, and `gh`. Checksums: `atelier_{{ .Version }}_checksums.txt`.
