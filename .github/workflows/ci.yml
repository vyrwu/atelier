name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # RELEASE_PR flags release-please's auto-generated PRs so each step is
    # skipped (not the job) — a skipped job would mark the required check
    # "skipped" and block merge; skipped steps still report "success".
    env:
      RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7
        if: env.RELEASE_PR != 'true'
      - uses: actions/setup-go@v6
        if: env.RELEASE_PR != 'true'
        with:
          go-version: '1.25'
          cache: true
      - name: go mod verify
        if: env.RELEASE_PR != 'true'
        run: go mod verify
      - name: gofmt
        if: env.RELEASE_PR != 'true'
        run: test -z "$(gofmt -l internal cmd)" || (gofmt -l internal cmd; exit 1)
      - name: vet
        if: env.RELEASE_PR != 'true'
        run: go vet ./...
      - name: build
        if: env.RELEASE_PR != 'true'
        run: make build
      - name: Release-PR skip marker
        if: env.RELEASE_PR == 'true'
        run: echo "release-please PR — CI intentionally skipped."

  lint:
    runs-on: ubuntu-latest
    env:
      RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7
        if: env.RELEASE_PR != 'true'
      - uses: actions/setup-go@v6
        if: env.RELEASE_PR != 'true'
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        if: env.RELEASE_PR != 'true'
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Release-PR skip marker
        if: env.RELEASE_PR == 'true'
        run: echo "release-please PR — lint intentionally skipped."

  goreleaser-check:
    runs-on: ubuntu-latest
    env:
      RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7
        if: env.RELEASE_PR != 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        if: env.RELEASE_PR != 'true'
        with:
          go-version: '1.25'
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        if: env.RELEASE_PR != 'true'
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check
      - name: Release-PR skip marker
        if: env.RELEASE_PR == 'true'
        run: echo "release-please PR — goreleaser check intentionally skipped."
