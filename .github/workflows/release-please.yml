name: release-please

# Keep the Release PR as the release gesture. The App token lets its PR pushes
# and release-published event start downstream workflows.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- push-only guard, current-main SHA check, no checkout or artifacts
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    environment: release-automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run also fires for PRs. Only a successful push in this repository
    # can reach release credentials; never check out or execute its artifacts.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Require CI for the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" == "$TESTED_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Main advanced; waiting for its own CI."
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.current.outputs.publish == 'true'
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: atelier
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.current.outputs.publish == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
