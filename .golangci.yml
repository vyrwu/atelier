version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - nolintlint

  exclusions:
    rules:
      # Tests create fixture files (including deliberately permissive modes)
      # under t.TempDir and invoke fixed tools against those fixtures. Keep
      # all other gosec checks, including overflow/crypto checks, in tests.
      - path: _test\.go$
        linters: [gosec]
        text: "G(204|301|302|304|306):"

  settings:
    errcheck:
      # Best-effort writes to user-visible sinks (stdout/stderr/tmux) aren't
      # recoverable; wrapping every print in `_, _ =` is noise without upside.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
